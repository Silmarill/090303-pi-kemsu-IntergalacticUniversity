name: Запуск Unit-тестов (v1.4)

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Номер Pull Request для проверки'
        required: true
        type: number

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TEST_RESULTS_DIR: TestResults
  TEST_REPORT_MARKER: '<!-- autograding-test-results-v1 -->'
  FAIL_IF_NO_TEST_PROJECTS: true

jobs:
  test-results:
    name: Run tests and publish PR report

    # Важно: workflow запускает код из PR. Поэтому pull_request_target ограничен PR из этого же репозитория.
    # PowerShell-скрипт берётся из main в workflow-base, а код PR проверяется отдельно в student-code.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)

    runs-on: windows-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Установить номер PR
        id: pr
        run: |
          if ("${{ github.event_name }}" -eq "pull_request_target") {
            $pr = "${{ github.event.number }}"
          } else {
            $pr = "${{ github.event.inputs.pr_number }}"
          }

          "number=$pr" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "PR_NUMBER=$pr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Получить trusted scripts из main
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: main
          fetch-depth: 1
          path: workflow-base
          token: ${{ github.token }}

      - name: Получить код из Pull Request
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 1
          path: student-code
          token: ${{ github.token }}

      - name: Установить MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Найти проекты и тестовые проекты
        id: detect
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "workflow-base\.github\scripts\unit-tests-report.ps1"
          $studentWorkspace = Join-Path $env:GITHUB_WORKSPACE "student-code"

          & $script `
            -Mode Detect `
            -Workspace $studentWorkspace `
            -PrNumber "${{ steps.pr.outputs.number }}" `
            -TestResultsDir "${{ env.TEST_RESULTS_DIR }}" `
            -TestReportMarker "${{ env.TEST_REPORT_MARKER }}"
        shell: pwsh

      - name: Установить .NET SDK по тестовым проектам
        if: steps.detect.outputs.has_dotnet_versions == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.detect.outputs.dotnet_versions }}

      - name: Показать версии .NET и MSBuild
        run: |
          dotnet --info
          msbuild -version
        shell: pwsh

      - name: Восстановить NuGet packages.config
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "workflow-base\.github\scripts\unit-tests-report.ps1"
          $studentWorkspace = Join-Path $env:GITHUB_WORKSPACE "student-code"

          & $script `
            -Mode RestorePackages `
            -Workspace $studentWorkspace `
            -PrNumber "${{ steps.pr.outputs.number }}" `
            -TestResultsDir "${{ env.TEST_RESULTS_DIR }}" `
            -TestReportMarker "${{ env.TEST_REPORT_MARKER }}"
        shell: pwsh

      - name: Восстановить SDK-style проекты
        if: steps.detect.outputs.has_dotnet_versions == 'true'
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "workflow-base\.github\scripts\unit-tests-report.ps1"
          $studentWorkspace = Join-Path $env:GITHUB_WORKSPACE "student-code"

          & $script `
            -Mode RestoreSdk `
            -Workspace $studentWorkspace `
            -PrNumber "${{ steps.pr.outputs.number }}" `
            -TestResultsDir "${{ env.TEST_RESULTS_DIR }}" `
            -TestReportMarker "${{ env.TEST_REPORT_MARKER }}"
        shell: pwsh

      - name: Запустить тесты и собрать TRX
        id: run_tests
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "workflow-base\.github\scripts\unit-tests-report.ps1"
          $studentWorkspace = Join-Path $env:GITHUB_WORKSPACE "student-code"

          & $script `
            -Mode RunTests `
            -Workspace $studentWorkspace `
            -PrNumber "${{ steps.pr.outputs.number }}" `
            -TestResultsDir "${{ env.TEST_RESULTS_DIR }}" `
            -TestReportMarker "${{ env.TEST_REPORT_MARKER }}"
        shell: pwsh

      - name: Сформировать Markdown-отчёт
        if: always()
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "workflow-base\.github\scripts\unit-tests-report.ps1"
          $studentWorkspace = Join-Path $env:GITHUB_WORKSPACE "student-code"

          & $script `
            -Mode Report `
            -Workspace $studentWorkspace `
            -PrNumber "${{ steps.pr.outputs.number }}" `
            -TestResultsDir "${{ env.TEST_RESULTS_DIR }}" `
            -TestReportMarker "${{ env.TEST_REPORT_MARKER }}"
        shell: pwsh

      - name: Опубликовать результаты тестов в Pull Request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number('${{ steps.pr.outputs.number }}');
            const marker = process.env.TEST_REPORT_MARKER;
            const reportPath = `${process.env.GITHUB_WORKSPACE}\\student-code\\${process.env.TEST_RESULTS_DIR}\\test-report.md`;

            let body = fs.readFileSync(reportPath, 'utf8');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body &&
              comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Загрузить артефакты тестового запуска
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pr-${{ steps.pr.outputs.number }}
          path: |
            student-code/TestResults/**
            student-code/projects.json
            student-code/test-projects.json
          if-no-files-found: ignore

      - name: Завершить workflow без падения из-за результатов тестов
        if: always()
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "workflow-base\.github\scripts\unit-tests-report.ps1"
          $studentWorkspace = Join-Path $env:GITHUB_WORKSPACE "student-code"

          & $script `
            -Mode Finalize `
            -Workspace $studentWorkspace `
            -PrNumber "${{ steps.pr.outputs.number }}" `
            -TestResultsDir "${{ env.TEST_RESULTS_DIR }}" `
            -TestReportMarker "${{ env.TEST_REPORT_MARKER }}"
        shell: pwsh
