name: Еженедельная проверка работ (v5, external ps1)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STYLECOP_ANALYZERS_VERSION: 1.2.0-beta.556

jobs:
  check-students:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install regex
        shell: pwsh

      - name: Show initial .NET and MSBuild versions
        shell: pwsh
        run: |
          if (Get-Command dotnet -ErrorAction SilentlyContinue) {
            dotnet --info
          } else {
            Write-Host ".NET SDK/CLI не найден на старте. При необходимости скрипт установит SDK по TargetFramework проекта."
          }

          msbuild -version

      - name: Process student branches
        shell: pwsh
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          COPILOT_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STYLECOP_ANALYZERS_VERSION: ${{ env.STYLECOP_ANALYZERS_VERSION }}
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE ".github/scripts/weekly-student-check.ps1"
          if (-not (Test-Path $scriptPath)) {
            throw "Weekly script file not found: $scriptPath. Commit .github/scripts/weekly-student-check.ps1 to the main branch."
          }

          pwsh -NoProfile -ExecutionPolicy Bypass -File $scriptPath

      - name: Upload all artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-artifacts-v5-${{ github.run_number }}
          path: artifacts/
